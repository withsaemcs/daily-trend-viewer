name: 트렌드 수집 및 Pages 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"  # 매일 22:00 UTC = 다음 날 07:00 KST (실제 실행은 지연될 수 있음)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 수집 및 정적 사이트 생성
        # 수집 실패 시 재사용할 이전 스냅샷을 이 저장소의 Pages 주소에서 읽습니다
        run: PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" python3 collect.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
